  <style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0e1012;font-family:'Barlow',sans-serif;color:#e8e8e8}

.pg{max-width:1060px;margin:0 auto;padding:28px 28px 64px}

.back{display:inline-flex;align-items:center;gap:7px;color:#888;font-size:11px;font-weight:700;text-decoration:none;margin-bottom:20px;letter-spacing:.8px;text-transform:uppercase;transition:color .2s}
.back:hover{color:#3dd900}

.bc{display:flex;align-items:center;gap:6px;margin-bottom:28px}
.bc a{font-size:11px;color:#888;text-decoration:none}
.bc a:hover{color:#3dd900}
.bc span{font-size:11px;color:#777}
.bc .cur{color:#999}

.main{display:grid;grid-template-columns:1fr 1.05fr;gap:36px;margin-bottom:36px;align-items:start}

.img-main-wrap{
  position:relative;width:100%;
  aspect-ratio:4/3;
  background:#0c1014;
  border:1px solid rgba(255,255,255,.07);
  border-radius:14px;
  overflow:hidden;
  margin-bottom:10px;
}
.img-main-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.img-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:72px;opacity:.18}
.img-chemistry{
  position:absolute;bottom:12px;left:12px;
  background:rgba(0,0,0,.78);color:#3dd900;
  font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  padding:3px 9px;border-radius:4px;border:1px solid rgba(61,217,0,.2)
}
.img-tag-pop{position:absolute;top:12px;right:12px;background:#e85d2a;color:#fff;font-size:8px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;padding:3px 8px;border-radius:4px;display:none}

.thumbs{display:flex;gap:8px}
.thumb{
  flex:1;aspect-ratio:4/3;
  background:#0c1014;border:1px solid rgba(255,255,255,.06);
  border-radius:8px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;opacity:.35;transition:all .2s;overflow:hidden;
}
.thumb.active{border-color:rgba(61,217,0,.4);opacity:1}
.thumb:hover:not(.active){border-color:rgba(61,217,0,.2);opacity:.65}

.info-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.badge{background:rgba(61,217,0,.08);color:#3dd900;border:1px solid rgba(61,217,0,.17);border-radius:5px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;padding:2px 8px}
.brand{font-size:10px;color:#999;font-weight:700;letter-spacing:.8px;text-transform:uppercase}

.prod-name{font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:900;line-height:1.05;letter-spacing:-.2px;color:#f0f0f0;margin-bottom:6px}
.prod-spec{font-size:11px;color:#3dd900;font-weight:700;margin-bottom:14px;letter-spacing:.3px}
.prod-desc{font-size:13px;color:#aaa;line-height:1.82;margin-bottom:18px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.chip{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:5px;font-size:10px;color:#999;padding:4px 10px;font-weight:600}

.price-box{background:#111316;border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.price-lbl{font-size:10px;color:#999;text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px}
.price-val{font-size:16px;color:#3dd900;font-weight:800}
.price-note{font-size:10px;color:#999;text-align:right;line-height:1.6}

.cta-two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.btn-g{background:#3dd900;color:#0e1012;border:none;padding:13px;border-radius:9px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;text-decoration:none;text-align:center;display:block;transition:opacity .2s}
.btn-g:hover{opacity:.86}
.btn-w{background:rgba(61,217,0,.09);color:#3dd900;border:1px solid rgba(61,217,0,.2);padding:13px;border-radius:9px;font-size:13px;font-weight:800;text-decoration:none;text-align:center;display:block;transition:background .2s}
.btn-w:hover{background:rgba(61,217,0,.16)}
.btn-c{background:transparent;color:#aaa;border:1px solid rgba(255,255,255,.08);padding:10px;border-radius:9px;font-size:12px;font-weight:600;text-decoration:none;text-align:center;display:block;grid-column:span 2;transition:border-color .2s}
.btn-c:hover{border-color:rgba(255,255,255,.18)}

.trust{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.trust span{font-size:10px;color:#999;display:flex;align-items:center;gap:4px}
.trust span::before{content:'✓';color:#3dd900;font-weight:800}

.tabs{margin-bottom:36px}
.tab-nav{display:flex;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:22px}
.tb{background:none;border:none;padding:10px 16px;font-size:11px;font-weight:700;color:#888;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit;letter-spacing:.8px;text-transform:uppercase;transition:color .2s}
.tb.on{color:#3dd900;border-bottom-color:#3dd900}
.tb:hover:not(.on){color:#aaa}
.tp{display:none}
.tp.on{display:block}

.st{width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden}
.st tr{border-bottom:1px solid rgba(255,255,255,.04)}
.st tr:last-child{border:none}
.st td{padding:11px 14px;font-size:13px;vertical-align:middle}
.st td:first-child{font-size:10px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.8px;width:36%;background:#111316}
.st td:last-child{color:#ccc;background:#0e1012}
.st tr:nth-child(even) td:last-child{background:#0a0d0f}
.st tr:nth-child(even) td:first-child{background:#111316}

.feat-g{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.fc{background:#111316;border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:14px;display:flex;gap:12px}
.fi{width:30px;height:30px;flex-shrink:0;background:rgba(61,217,0,.06);border:1px solid rgba(61,217,0,.13);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px}
.ft{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;color:#bbb;margin-bottom:3px}
.fd{font-size:11px;color:#999;line-height:1.6}

.rel-head{font-size:10px;color:#3dd900;text-transform:uppercase;letter-spacing:2px;font-weight:700;margin-bottom:14px}
.rel-g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.rc{background:#111316;border:1px solid rgba(61,217,0,.15);border-radius:11px;overflow:hidden;cursor:pointer;transition:border-color .22s,transform .22s}
.rc:hover{border-color:rgba(61,217,0,.35);transform:translateY(-2px);box-shadow:0 8px 20px rgba(61,217,0,.08)}
.rc-img{width:100%;aspect-ratio:4/3;background:#0c1014;display:flex;align-items:center;justify-content:center;font-size:24px;border-bottom:1px solid rgba(255,255,255,.05);position:relative}
.rc-img::before{content:'🔋';position:absolute;opacity:.15}
.rc-img img{width:100%;height:100%;object-fit:cover;display:block;opacity:1}
.rc-body{padding:10px 11px;background:linear-gradient(135deg, #111316 0%, #0f1113 100%)}
.rc-badge{font-size:8px;color:#3dd900;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;background:rgba(61,217,0,.08);padding:3px 6px;border-radius:3px;display:inline-block}
.rc-name{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;color:#ddd;margin-bottom:3px;line-height:1.2}
.rc-spec{font-size:9px;color:#aaa;margin-bottom:8px;line-height:1.5}
.rc-btn{width:100%;background:rgba(61,217,0,.12);color:#3dd900;border:1px solid rgba(61,217,0,.25);padding:5px;border-radius:5px;font-size:10px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .2s}
.rc-btn:hover{background:rgba(61,217,0,.2);border-color:rgba(61,217,0,.35)}

@media(max-width:900px){
  .main{grid-template-columns:1fr;gap:24px}
  .rel-g{grid-template-columns:repeat(2,1fr)}
  .feat-g{grid-template-columns:1fr}
}

@media(max-width:768px){
  .pg{padding:20px 16px 50px}
  .back{font-size:10px;margin-bottom:16px}
  .bc{margin-bottom:20px}
  .prod-name{font-size:28px}
  .cta-two{grid-template-columns:1fr;gap:8px}
  .btn-c{grid-column:span 1}
  .rel-g{grid-template-columns:1fr}
  .feat-g{grid-template-columns:1fr}
  .st{font-size:12px}
  .st td{padding:9px 12px}
  .st td:first-child{font-size:9px}
  .cta-two{margin-bottom:8px}
  .trust{gap:8px}
  .trust span{font-size:9px}
  .price-box{padding:10px 14px}
  .price-val{font-size:14px}
}

@media(max-width:640px){
  .pg{padding:16px 14px 40px}
  .prod-name{font-size:24px;margin-bottom:4px}
  .back{font-size:9px}
  .info-top{margin-bottom:8px}
  .badge{font-size:8px;padding:2px 6px}
  .brand{font-size:9px}
  .prod-desc{font-size:12px;margin-bottom:14px}
  .chips{gap:4px;margin-bottom:12px}
  .chip{font-size:9px;padding:3px 8px}
  .price-box{padding:10px 12px;margin-bottom:12px}
  .price-lbl{font-size:9px;margin-bottom:2px}
  .price-val{font-size:14px}
  .cta-two{gap:6px}
  .btn-g,.btn-w,.btn-c{padding:12px;font-size:12px}
  .trust{margin-top:10px}
  .trust span{font-size:9px}
  .tabs{margin-bottom:28px}
  .tb{padding:8px 12px;font-size:10px}
  .st{font-size:11px;margin-bottom:20px}
  .st td{padding:8px 10px}
  .st td:first-child{font-size:8px;width:40%}
  .feat-g{grid-template-columns:1fr}
  .fc{padding:12px;gap:10px}
  .fi{width:28px;height:28px;font-size:12px}
  .ft{font-size:14px}
  .fd{font-size:10px}
  .rel-head{font-size:9px;margin-bottom:12px}
  .rel-g{gap:10px}
  .rc-img{aspect-ratio:4/3}
  .rc-badge{font-size:7px}
  .rc-name{font-size:12px}
  .rc-spec{font-size:8px}
  .rc-btn{font-size:9px;padding:4px}
}

  <script>
    function updateMetaTags(product) {
      if(!product) return;
      const title = product.name + ' | Arkaworld™';
      const desc = product.description || 'Premium LiFePO4 battery from Arkaworld™';
      document.getElementById('pageTitle').textContent = title;
      document.getElementById('metaDescription').setAttribute('content', desc);
      document.getElementById('ogTitle').setAttribute('content', product.name);
      document.getElementById('ogImage').setAttribute('content', product.image);
      document.getElementById('ogDesc').setAttribute('content', desc);
      document.getElementById('canonical').setAttribute('href', 'https://arkaworld26.com/product-detail.html?product=' + product.id);
      document.getElementById('twitterTitle').setAttribute('content', product.name);
      document.getElementById('twitterImage').setAttribute('content', product.image);
    }
  </script>

<body>
  <div class="pg" id="page">
    <a href="products.html" class="back">← Back to Products</a>
    
    <div class="bc">
      <a href="index.html">Home</a>
      <span>/</span>
      <a href="products.html">Products</a>
      <span>/</span>
      <span id="bcCat" class="cur">Product</span>
    </div>

    <div class="main">
      <div class="img-side">
        <div class="img-main-wrap">
          <img id="mainImg" src="" alt="">
          <div id="chemTag" class="img-chemistry"></div>
        </div>
        <div class="thumbs" id="thumbs"></div>
      </div>

      <div class="info-side">
        <div class="info-top">
          <div id="badgeTag" class="badge"></div>
          <div id="brandTag" class="brand"></div>
        </div>
        <h1 class="prod-name" id="prodName"></h1>
        <div class="prod-spec" id="prodSpec"></div>
        <p class="prod-desc" id="prodDesc"></p>
        
        <div class="chips" id="chips"></div>

        <div class="price-box">
          <div>
            <div class="price-lbl">Price</div>
            <div class="price-val" id="priceVal"></div>
          </div>
          <div class="price-note">
            <div>Contact us for</div>
            <div>bulk orders</div>
          </div>
        </div>

        <div class="cta-two">
          <button class="btn-g" onclick="location.href='contact.html'">Get Quote</button>
          <a href="https://wa.me/message/ARKAWORLD" class="btn-w">WhatsApp</a>
        </div>

        <div class="trust">
          <span>Certified supplier</span>
          <span>Fast shipping</span>
          <span>Quality guaranteed</span>
        </div>
      </div>
    </div>

    <div class="tabs">
      <div class="tab-nav">
        <button class="tb on" onclick="tabClick(0)">Specifications</button>
        <button class="tb" onclick="tabClick(1)">Features</button>
      </div>

      <div class="tp on" id="tab0">
        <table class="st" id="specsTable"></table>
      </div>

      <div class="tp" id="tab1">
        <div class="feat-g" id="featuresGrid"></div>
      </div>
    </div>

    <div id="relProdSection" style="display:none;">
      <h2 class="rel-head">Related Products</h2>
      <div class="rel-g" id="relProd"></div>
    </div>
  </div>

  <script>
let products = [];
let currentProduct = null;
let relatedProducts = [];

async function init() {
  try {
    const res = await fetch('data/products.json');
    const data = await res.json();
    products = data.products;
    
    const params = new URLSearchParams(window.location.search);
    const pid = params.get('product') || params.get('id');
    
    if (!pid) {
      document.getElementById('page').innerHTML = '<div style="text-align:center;padding:60px 20px;"><h2>Product not found</h2><p>Please select a product from the catalog.</p><a href="products.html" style="color:#3dd900;text-decoration:none;">Back to products</a></div>';
      return;
    }
    
    currentProduct = products.find(p => p.id === pid);
    if (!currentProduct) {
      document.getElementById('page').innerHTML = '<div style="text-align:center;padding:60px 20px;"><h2>Product not found</h2><a href="products.html" style="color:#3dd900;text-decoration:none;">Back to products</a></div>';
      return;
    }
    
    document.title = `${currentProduct.name} | Arkaworld™`;
    updateMetaTags(currentProduct);
    renderProduct();
    renderRelated();
  } catch (e) {
    // Error handled silently
  }
}

function renderProduct() {
  const p = currentProduct;
  
  document.getElementById('pageTitle').textContent = `${p.name} | Arkaworld™`;
  document.getElementById('badgeTag').textContent = p.badge || 'FEATURED';
  document.getElementById('brandTag').textContent = p.brand || 'ARKAWORLD';
  document.getElementById('bcCat').textContent = p.category.toUpperCase();
  document.getElementById('prodName').textContent = p.name;
  document.getElementById('prodSpec').textContent = (p.details?.voltage ? `${p.details.voltage} | ` : '') + (p.details?.capacity ? `${p.details.capacity}` : '');
  document.getElementById('prodDesc').textContent = p.description;
  document.getElementById('mainImg').src = p.image;
  document.getElementById('mainImg').alt = p.name;
  document.getElementById('priceVal').textContent = p.price || 'Call for price';
  
  if (p.details?.chemistry) {
    document.getElementById('chemTag').textContent = p.details.chemistry;
  }

  const chipsHtml = [];
  if (p.details?.warranty) chipsHtml.push(`<div class="chip">${p.details.warranty} Warranty</div>`);
  if (p.details?.cycles) chipsHtml.push(`<div class="chip">${p.details.cycles} Cycles</div>`);
  if (p.details?.range) chipsHtml.push(`<div class="chip">Range: ${p.details.range}</div>`);
  document.getElementById('chips').innerHTML = chipsHtml.join('');

  const specsData = [
    ['Voltage', p.details?.voltage || '—'],
    ['Capacity', p.details?.capacity || '—'],
    ['Chemistry', p.details?.chemistry || '—'],
    ['Cycles', p.details?.cycles || '—'],
    ['Warranty', p.details?.warranty || '—'],
    ['Weight', p.details?.weight || '—'],
  ];
  
  const tableHtml = specsData.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
  document.getElementById('specsTable').innerHTML = tableHtml;

  const featuresData = [
    { icon: '⚡', title: 'High Performance', desc: 'Optimized for maximum efficiency' },
    { icon: '🛡️', title: 'Advanced Safety', desc: 'Built-in protection systems' },
    { icon: '♻️', title: 'Eco-Friendly', desc: 'Sustainable lithium technology' },
    { icon: '🔧', title: 'Easy Installation', desc: 'Simple mounting and setup' },
    { icon: '📊', title: 'Smart Monitoring', desc: 'Real-time performance tracking' },
    { icon: '🌍', title: 'Wide Compatibility', desc: 'Works with various systems' },
  ];

  const featHtml = featuresData.map(f => `
    <div class="fc">
      <div class="fi">${f.icon}</div>
      <div>
        <div class="ft">${f.title}</div>
        <div class="fd">${f.desc}</div>
      </div>
    </div>
  `).join('');
  document.getElementById('featuresGrid').innerHTML = featHtml;
  
  // Update JSON-LD Schema
  const schema = {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": p.name,
    "description": p.description,
    "image": p.image,
    "brand": {
      "@type": "Brand",
      "name": p.brand || "Arkaworld™"
    },
    "manufacturer": {
      "@type": "Organization",
      "name": "Arkaworld™"
    },
    "offers": {
      "@type": "Offer",
      "url": `https://arkaworld26.com/product-detail.html?product=${p.id}`,
      "priceCurrency": "INR",
      "price": p.price?.replace(/[^\d]/g, '') || "0",
      "availability": "https://schema.org/InStock"
    },
    "aggregateRating": {
      "@type": "AggregateRating",
      "ratingValue": "4.8",
      "ratingCount": "250"
    }
  };
  document.getElementById('productSchema').textContent = JSON.stringify(schema, null, 2);
}

function renderRelated() {
  const cat = currentProduct.category;
  relatedProducts = products.filter(p => p.category === cat && p.id !== currentProduct.id).slice(0, 4);
  
  if (relatedProducts.length === 0) {
    document.getElementById('relProdSection').style.display = 'none';
    return;
  }
  
  document.getElementById('relProdSection').style.display = 'block';
  
  const relHtml = relatedProducts.map(p => `
    <div class="rc" onclick="location.href='product-detail.html?product=${p.id}'">
      <div class="rc-img">
        <img src="${p.image}" alt="${p.name}" onerror="this.style.display='none'">
      </div>
      <div class="rc-body">
        <div class="rc-badge">${p.badge || 'PRODUCT'}</div>
        <div class="rc-name">${p.name}</div>
        <div class="rc-spec">${p.details?.voltage || '—'} | ${p.details?.capacity || '—'}</div>
        <button class="rc-btn" onclick="event.stopPropagation(); location.href='product-detail.html?product=${p.id}'">View</button>
      </div>
    </div>
  `).join('');
  
  document.getElementById('relProd').innerHTML = relHtml;
}

function tabClick(n) {
  document.querySelectorAll('.tb').forEach(b => b.classList.remove('on'));
  document.querySelectorAll('.tp').forEach(t => t.classList.remove('on'));
  document.querySelectorAll('.tb')[n].classList.add('on');
  document.getElementById('tab' + n).classList.add('on');
}

init();
  </script>
